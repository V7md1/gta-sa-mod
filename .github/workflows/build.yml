name: Build GTA SA Motion Blur

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Release Win32
        run: msbuild MotionBlur.sln /m /p:Configuration=Release /p:Platform=Win32
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item bin\Release\MotionBlur.asi package\MotionBlur.asi
          Copy-Item MotionBlur.ini package\MotionBlur.ini
      - uses: actions/upload-artifact@v4
        with:
          name: GTA-SA-MotionBlur-Win32
          path: package
